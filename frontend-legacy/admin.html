<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración | SmoothieFit</title>
  <meta name="description" content="Panel académico de administración de productos SmoothieFit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/layout.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
  <main class="container page-content admin-page">
    <section class="admin-login card" id="admin-login" aria-labelledby="login-title">
      <p class="eyebrow">Acceso de administración</p>
      <h1 id="login-title">Ingresa tu clave</h1>
      <form id="login-form" novalidate>
        <label for="admin-key">Clave de administrador</label>
        <input id="admin-key" name="admin-key" type="password" autocomplete="current-password" aria-describedby="login-key-error" required>
        <p class="field-error" id="login-key-error"></p>
        <p class="admin-message" id="login-message" role="alert" aria-live="assertive"></p>
        <button class="button button-primary" type="submit">Entrar</button>
      </form>
    </section>

    <section class="admin-dashboard" id="admin-dashboard" hidden aria-labelledby="admin-title">
      <div class="admin-heading">
        <div>
          <p class="eyebrow">Panel de control</p>
          <h1 id="admin-title">Administrar smoothies</h1>
        </div>
        <button class="button button-secondary" id="logout-button" type="button">Cerrar sesión</button>
      </div>

      <p class="admin-message" id="admin-message" role="status" aria-live="polite"></p>

      <section class="card admin-form-card" aria-labelledby="product-form-title">
        <h2 id="product-form-title">Agregar un producto</h2>
        <form id="product-form" novalidate>
          <div class="admin-form-grid">
            <div class="form-field">
              <label for="product-name">Nombre</label>
              <input id="product-name" name="nombre" type="text" maxlength="80" aria-describedby="error-nombre" required>
              <p class="field-error" id="error-nombre"></p>
            </div>
            <div class="form-field">
              <label for="product-category">Categoría</label>
              <input id="product-category" name="categoria" type="text" maxlength="50" aria-describedby="error-categoria" required>
              <p class="field-error" id="error-categoria"></p>
            </div>
            <div class="form-field form-field-wide">
              <label for="product-description">Descripción</label>
              <textarea id="product-description" name="descripcion" rows="3" maxlength="250" aria-describedby="error-descripcion" required></textarea>
              <p class="field-error" id="error-descripcion"></p>
            </div>
            <div class="form-field form-field-wide">
              <label for="product-ingredients">Ingredientes (separados por coma)</label>
              <input id="product-ingredients" name="ingredientes" type="text" aria-describedby="error-ingredientes" required>
              <p class="field-error" id="error-ingredientes"></p>
            </div>
            <div class="form-field">
              <label for="product-price">Precio (USD)</label>
              <input id="product-price" name="precio" type="number" min="0.01" step="0.01" aria-describedby="error-precio" required>
              <p class="field-error" id="error-precio"></p>
            </div>
            <div class="form-field">
              <label for="product-image">Emoji para ilustrar</label>
              <input id="product-image" name="imagen" type="text" maxlength="200" aria-describedby="error-imagen" required>
              <p class="field-error" id="error-imagen"></p>
            </div>
          </div>
          <div class="admin-form-actions">
            <button class="button button-primary" id="save-product-button" type="submit">Guardar producto</button>
            <button class="button button-secondary" id="cancel-edit-button" type="button" hidden>Cancelar edición</button>
          </div>
        </form>
      </section>

      <section class="admin-products-section" aria-labelledby="products-title">
        <h2 id="products-title">Productos actuales</h2>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Categoría</th>
                <th scope="col">Precio</th>
                <th scope="col">Ingredientes</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody id="products-table-body"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
